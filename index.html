  function randomIndex(limit) {

      const bucket = Math.floor(0x100000000 / limit) * limit;

  const configuredApiUrl = String(window.OSZTV_API_URL||'').trim();

  function updateSyncStatus(){
    const el=$('syncStatus'); if(!el||!state)return;
    const status=state.serverStatus||'pending';
    el.className='sync-status'+(status==='saved'?' ok':status==='error'?' bad':'');

  // Többnyire a Workspace és a nyilvános Google URL közül csak az egyik elérhető.
  // Amelyik a health kérésre valóban válaszol, azt használjuk a POST és check során is.
  function jsonpRequest(action, parameters={}, timeoutMs=9000){
    if (!apiReady) return Promise.reject(Error('A Google Apps Script /exec URL nincs helyesen beállítva.'));
    const endpoints = [apiUrl, ...apiCandidates.filter(u=>u!==apiUrl)];
    const requestOnce = (endpoint) => new Promise((resolve,reject)=>{
      const callback='osztvLb'+Date.now().toString(36)+Math.random().toString(36).slice(2,9);
      const script=document.createElement('script');let finished=false;
      const clear=()=>{if(finished)return false;finished=true;clearTimeout(timer);script.remove();delete window[callback];return true;};
      const timer=setTimeout(()=>{if(clear())reject(Error('Nem érkezett válasz (időtúllépés).'));},timeoutMs);
      window[callback]=d=>{if(clear())resolve(d);};
      script.onerror=()=>{if(clear())reject(Error('A böngésző nem tudta betölteni a válaszszkriptet.'));};
      const query=new URLSearchParams({action,callback,...parameters,t:String(Date.now())});
      script.src=endpoint+(endpoint.includes('?')?'&':'?')+query.toString();
      document.head.appendChild(script);
    });
    return (async()=>{
      const errors=[];
      for(const endpoint of endpoints){
        try{
          const result=await requestOnce(endpoint);
          // A health sikerét meg kell erősíteni; a többi API-hibát változatlanul visszaadjuk.
          if(action==='health' && (!result || result.ok!==true)){

  }

      // ha a Google egy bejelentkezési/átirányítási oldalt adott vissza.

      submitResultForm(payload);

      if(!found)throw Error(lastPostError || 'A Google Táblázat nem igazolta a beküldést. Nyisd meg az Apps Script → Végrehajtások részt: ha nincs doPost, a kérés nem érkezik meg. Ha van hibás doPost, annak részlete adja az okot.');
    }catch(ex){
      if(state?.sessionId===sid&&state.serverStatus!=='saved'){
        state.serverStatus='error';state.serverError=String(ex.message||ex);save();updateSyncStatus();
      }

  async function launch(name, group, attempt, alias) {
    const queue = shuffle(questions.map(q => q.id));
    const optionOrders = {};
    questions.forEach(q => optionOrders[q.id] = shuffle(q.options.map(o => o.id)));
    const startedAt = Date.now();
    state = {version:3,stage:'exam',name,group,alias:alias||name,attempt,startedAt,
      deadline:startedAt+DATA.durationMinutes*60000,
      queue,optionOrders,cursor:0,answers:{},skipped:[],
      departures:0,events:[],sessionId:Math.random().toString(36).slice(2,8).toUpperCase()+Date.now().toString(36).toUpperCase(),

    guardGraceUntil = Date.now() + 4000;
    if (document.documentElement.requestFullscreen) {
      try { await document.documentElement.requestFullscreen({navigationUI:'hide'}); }
      catch { notice('A teljes képernyő nem indult el. A dolgozat így is figyeli az oldalváltást.'); }
    } else { notice('Ez a böngésző nem támogatja a kötelező teljes képernyős nézetet.'); }
    history.pushState({osztvExam:true},'',location.pathname+location.search+location.hash);
    examPage();
  }

      notice('A kérdés az első kör végén újra megjelenik.');

  function confirmEarlyFinish() {

  function checkTime() {
    if (!state) return;
    if (state.stage === 'exam') {
      if (Date.now() >= state.deadline) { finalize('Lejárt az idő'); return; }
      const clock = $('clock');
      if (clock) {
        clock.textContent = formatClock(state.deadline-Date.now());
        clock.classList.toggle('urgent', state.deadline-Date.now()<300000);
      }
    } else if (state.stage === 'finished') {
      const remaining=state.reviewUntil-Date.now();
      const clock=$('reviewClock');
      if (clock && remaining > 0) clock.textContent=formatClock(remaining);
      if (remaining <= 0 && $('reviewClock')) resultsPage();
    }
  }
  function guard(reason) {
    if (!state || state.stage !== 'exam') return;
    const now=Date.now();
    if (now < guardGraceUntil || now-lastGuardAt < 1800) return;
    lastGuardAt=now;
    state.departures++;
    state.events.push({time:now,event:reason});
    save();
    if (state.departures >= LIMIT) {
      finalize('Automatikus lezárás – túl sok oldalelhagyás');
      return;
    }
    pendingWarning=true;
    if (document.visibilityState==='visible' && document.hasFocus()) showPendingWarning();
  }
  function showPendingWarning() {
    if (!pendingWarning || !state || state.stage !== 'exam') return;
    pendingWarning=false;

    const shade=document.createElement('div');
    shade.className='dialog-shade';shade.id='guardDialog';

      <div class="dialog-actions"><button type="button" id="guardResume" class="btn btn-wide">Megértettem, folytatom</button></div></div>`;
    document.body.appendChild(shade);
    $('guardResume').addEventListener('click',async()=>{
      shade.remove();
      guardGraceUntil=Date.now()+3500;
      if (!document.fullscreenElement && document.documentElement.requestFullscreen) {

    });

  function finalize(reason) {
    if (!state || state.stage !== 'exam') return;
    state.stage='finished';
    state.finishedAt=Date.now();
    state.reviewUntil=state.finishedAt+DATA.reviewMinutes*60*1000;
    state.finishReason=reason;
    save();
    pendingWarning=false;
    document.getElementById('guardDialog')?.remove();
    document.getElementById('finishDialog')?.remove();
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{});
    resultsPage();
    sendResult();
  }
  function details() {
    const rows = DATA.sections.map(section => {
      const qs=section.questions;
      const got=qs.filter(q=>state.answers[q.id]===q.correctOptionId).length;
      const answered=qs.filter(q=>q.id in state.answers).length;
      return {section:section.title,got,max:qs.length,points:got*2,maxPoints:qs.length*2,answered};
    });
    const score=rows.reduce((a,r)=>a+r.points,0);
    const good=score/2;
    const answered=answeredCount();
    const wrong=answered-good;
    return {rows,score,percent:Math.round(score/DATA.maxPoints*100),good,wrong,unanswered:TOTAL-answered,answered};
  }
  // Kizárólag az eredményképernyő megjelenítési szűrője.
  // A kiosztott sorrendet minden nézetben az első 50 kérdés első megjelenése adja.
  function renderReview(filter, scrollToReview=false) {
    if (!state || state.stage !== 'finished') return;
    const valid=['correct','wrong','unanswered','departures','all'];
    selectedReviewFilter=valid.includes(filter)?filter:'wrong';
    const title=$('reviewTitle'), hint=$('reviewHint'), list=$('reviewList');
    if (!title || !hint || !list) return;
    document.querySelectorAll('[data-review-filter]').forEach(card=>{
      const active=card.dataset.reviewFilter===selectedReviewFilter;
      card.setAttribute('aria-pressed',String(active));
      card.classList.toggle('is-selected',active);
    });
    const titles={correct:'Helyes válaszok',wrong:'Hibás válaszok',unanswered:'Megválaszolatlan kérdések',departures:'Oldalelhagyási események',all:'Az összes kérdés'};
    title.textContent=titles[selectedReviewFilter];
    hint.textContent=selectedReviewFilter==='departures'
      ? 'A teszt közben rögzített oldalelhagyási események időrendben.'
      : 'A kérdések a tanulónak kiosztott eredeti sorrendben jelennek meg. Az átugrott kérdés csak egyszer szerepel.';
    if (selectedReviewFilter==='departures') {
      list.innerHTML=state.events.length ? state.events.map((entry,i)=>
        `<article class="review-events"><p><strong>${i+1}. jelzés</strong> · ${dateTime(entry.time)}</p><p>${escapeHTML(entry.event)}</p></article>`
      ).join('') : '<div class="review-expired">Nem történt oldalelhagyási jelzés a teszt alatt.</div>';
    } else if (Date.now() >= state.reviewUntil) {
      list.innerHTML='<div class="review-expired">⏳ Az 5 perces megtekintési idő lejárt. A kérdések és helyes megoldások már nem láthatók. Az eredménylap továbbra is letölthető.</div>';
    } else {
      const ordered=state.queue.slice(0,TOTAL)
        .map((id,idx)=>({q:lookup.get(id),position:idx+1}))
        .filter(row=>row.q)
        .map(row=>{
          const answered=Object.prototype.hasOwnProperty.call(state.answers,row.q.id);
          return {...row,kind:!answered?'unanswered':state.answers[row.q.id]===row.q.correctOptionId?'correct':'wrong'};
        });
      const shown=selectedReviewFilter==='all'?ordered:ordered.filter(row=>row.kind===selectedReviewFilter);
      const status={correct:'✓ Helyes',wrong:'✕ Hibás',unanswered:'— Megválaszolatlan'};
      list.innerHTML=shown.length?shown.map(({q,position,kind})=>{
        const yourAnswer=q.options.find(o=>o.id===state.answers[q.id]);
        const correctAnswer=q.options.find(o=>o.id===q.correctOptionId);
        const answerText=kind==='unanswered'
          ? '<p class="bad">Nem érkezett válasz erre a kérdésre.</p>'
          : `<p class="${kind==='correct'?'good':'bad'}">A válaszod: <strong>${escapeHTML(yourAnswer?.text||'–')}</strong></p>`;
        return `<article class="wrong"><div class="wrong-meta">${position}. kérdés a tesztben · ${escapeHTML(sectionName(q.section))}<span class="review-status ${kind==='wrong'?'wrong-answer':kind}">${status[kind]}</span></div><h3>${escapeHTML(q.text)}</h3>${answerText}<p class="good">Helyes válasz: <strong>${escapeHTML(correctAnswer?.text||'–')}</strong></p></article>`;
      }).join('') : '<div class="review-expired">Ebben a kategóriában nincs kérdés.</div>';
    }
    if(scrollToReview) $('reviewPanel')?.scrollIntoView({behavior:'smooth',block:'start'});
  }

        <div class="review-toolbar"><div><strong id="reviewTitle">Hibás válaszok</strong><p id="reviewHint">Kattints fent egy eredménykártyára a szűréshez.</p></div><button type="button" class="btn btn-quiet" id="reviewShowAll">☷ Összes kérdés</button></div>
        ${reviewOpen ? `<div class="review-box"><div><strong>✓ A válaszok még megtekinthetők</strong><p>A kérdések és helyes megoldások a befejezéstől számított 5 percig láthatók. Válassz egy kártyát.</p></div><div id="reviewClock" class="review-clock">${formatClock(remains)}</div></div>` : `<div class="review-expired">⏳ Az 5 perces megtekintési idő lejárt. A helyes megoldások már nem láthatók. Az oldalelhagyási események továbbra is megtekinthetők.</div>`}
        <div id="reviewList" class="wrong-list" role="region" aria-live="polite" aria-label="Kiválasztott kérdések"></div>
      </section>
      <section class="result-panel leaderboard"><h2>🏆 2024-es toplista</h2><p class="panel-p">A legjobb és a legalább 60 pontos leggyorsabb teljesítmények. Kizárólag toplistás becenevek láthatók.</p><div class="lb-actions"><button type="button" id="leaderboardRefresh" class="btn btn-quiet">↻ Toplista frissítése</button></div><div id="leaderboardContent" class="sync-status">Toplista betöltése…</div></section><section class="result-panel"><h2>Google Táblázatos mentés</h2><div id="syncStatus" class="sync-status">Eredmény továbbítása a tanár táblázatába…</div><button type="button" id="syncRetry" class="btn btn-quiet">↻ Mentés újrapróbálása</button><p class="lb-muted">Az eredmény csak akkor biztosan megérkezett, ha itt a sikeres mentés visszaigazolása látható.</p></section><section class="result-panel"><h2>Eredménylap továbbítása</h2><p class="panel-p" style="margin:0 0 16px">A PDF-hez kattints az alábbi gombra. A böngésző nyomtatási ablakában a <strong>Cél / Nyomtató</strong> mezőben válaszd a <strong>Mentés PDF-ként</strong> lehetőséget, majd a <strong>Mentés</strong> gombot. A sikeres Google Táblázatos mentést külön visszaigazoljuk. A PDF-et saját célra is elmentheted.</p><div class="results-actions"><button id="pdfButton" class="btn" type="button">⎙ Eredménylap mentése PDF-ként</button><button id="resetButton" class="btn btn-quiet" type="button">↻ Újrapróbálkozás / nullázás</button></div><p class="result-message">Próbálkozás: ${state.attempt}. · Azonosító: ${escapeHTML(state.sessionId)} · A PDF tartalmazza a pontszámot, a témakörök eredményét és az oldalelhagyásokat, de a megoldókulcsot nem.</p></section>
      <div class="notice">A weboldal publikus GitHub Pages-en fut. A Google Apps Script újraszámolja a pontszámot, de a böngészőben végzett munka és az időadatok hitelességét önmagában nem tudja garantálni.</div>
    </main>${footer()}`;
    renderReport();
    document.querySelectorAll('[data-review-filter]').forEach(card=>card.addEventListener('click',()=>renderReview(card.dataset.reviewFilter,true)));
    $('reviewShowAll')?.addEventListener('click',()=>renderReview('all',true));
    renderReview(selectedReviewFilter);
    $('pdfButton').addEventListener('click',pdfDownload);
    $('syncRetry')?.addEventListener('click',()=>sendResult(true));
    $('leaderboardRefresh')?.addEventListener('click',loadLeaderboard);loadLeaderboard();
    updateSyncStatus();
    $('resetButton').addEventListener('click',()=>{
      if (!window.confirm('Biztosan törölni szeretnéd a mostani próbálkozást, és új tesztet kezdenél? Az előző eredmény helyben nem lesz visszaállítható. Előbb mentsd el PDF-ben!')) return;
      const name=state.name,group=state.group,alias=state.alias,attempt=state.attempt+1;
      try { localStorage.removeItem(STORAGE); } catch (e) { console.warn("A helyi tárolás nem érhető el.", e); }
      state=null;
      selectedReviewFilter='wrong';
      homepage();
      $('studentName').value=name;$('studentClass').value=group;$('studentAlias').value=alias||'';
      $('honorRules').checked=false;
      $('studentName').scrollIntoView({behavior:'smooth',block:'center'});
      notice(`A ${attempt}. próbálkozás előtt fogadd el ismét a szabályokat.`);
      // Next attempt is recorded in temporary memory, not browser storage.
      $('startForm').addEventListener('submit', function updateAttempt(){ /* First-page form gets regular start. */ },{once:true});
      document.documentElement.dataset.nextAttempt=String(attempt);
    });
  }
  function reportHTML() {
    const d=details();
    const spent=Math.max(0,Math.ceil((state.finishedAt-state.startedAt)/60000));
    return `<div class="pr-head"><div class="pr-meta">OSZTV 2024 · INFORMATIKAI RENDSZER- ÉS ALKALMAZÁS-ÜZEMELTETŐ TECHNIKUS</div><h1>Interaktív tudáspróba – eredménylap</h1><div class="pr-meta">50 kérdés · 100 pont · 60 perc</div></div>
      <table><tbody><tr><td><strong>Tanuló neve</strong></td><td>${escapeHTML(state.name)}</td></tr><tr><td><strong>Osztály / csoport</strong></td><td>${escapeHTML(state.group)}</td></tr><tr><td><strong>Próbálkozás / azonosító</strong></td><td>${state.attempt}. / ${escapeHTML(state.sessionId)}</td></tr><tr><td><strong>Kezdés</strong></td><td>${dateTime(state.startedAt)}</td></tr><tr><td><strong>Befejezés</strong></td><td>${dateTime(state.finishedAt)}</td></tr><tr><td><strong>Eltelt idő</strong></td><td>${spent} perc</td></tr><tr><td><strong>Lezárás oka</strong></td><td>${escapeHTML(state.finishReason)}</td></tr></tbody></table>
      <div class="pr-score">${d.percent}% <small>${d.score} / 100 pont</small></div>
      <div>Helyes: <strong>${d.good}</strong> · Hibás: <strong>${d.wrong}</strong> · Megválaszolatlan: <strong>${d.unanswered}</strong> · Oldalelhagyási jelzés: <strong>${state.departures}</strong></div>
      <h2>Témakörönkénti pontszám</h2><table><thead><tr><th>Témakör</th><th>Elért pont</th><th>Maximum</th></tr></thead><tbody>${d.rows.map(r=>`<tr><td>${escapeHTML(r.section)}</td><td>${r.points}</td><td>${r.maxPoints}</td></tr>`).join('')}</tbody></table>
      <h2>Oldalelhagyási események</h2>${state.events.length ? `<table><thead><tr><th>Időpont</th><th>Esemény típusa</th></tr></thead><tbody>${state.events.map(e=>`<tr><td>${dateTime(e.time)}</td><td>${escapeHTML(e.event)}</td></tr>`).join('')}</tbody></table>` : '<p>A böngésző nem naplózott oldalelhagyási eseményt.</p>'}
      <div class="pr-foot">Forrás: 2024. évi OSZTV – megoldással ellátott területi előválogató feladatsor. Ez a PDF a tanuló böngészőjében készült, nem hitelesített szerveroldali vizsgajegyzőkönyv. A helyes válaszokat a dokumentum nem tartalmazza.</div>`;
  }
  function renderReport() {
    const print=$('print-sheet');
    if (print && state?.stage==='finished') print.innerHTML=reportHTML();
  }
  function pdfDownload() {
    if (!state || state.stage !== 'finished') return;
    // Render the separate, print-only sheet before invoking the browser's native PDF printer.
    // The older html2pdf canvas export could produce blank pages in some browsers.
    renderReport();
    const sheet = $('print-sheet');
    if (!sheet || !sheet.textContent.trim()) {
      notice('Nem sikerült elkészíteni az eredménylapot. Kérjük, frissítsd az oldalt, és próbáld újra.');
      return;
    }
    window.print();
  }
  // Focus changes cannot prevent other applications from opening; they are only signals.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState==='hidden') guard('Böngészőlap elrejtése');
    else if (pendingWarning) setTimeout(showPendingWarning,150);
  });
  window.addEventListener('blur', () => guard('A böngésző elvesztette a fókuszt'));
  window.addEventListener('focus', () => {if (pendingWarning) setTimeout(showPendingWarning,140);});
  document.addEventListener('fullscreenchange', () => {
    if (state?.stage==='exam' && !document.fullscreenElement && Date.now()>guardGraceUntil) guard('Kilépés teljes képernyőből');
  });
  window.addEventListener('pagehide', () => guard('Az oldal elhagyása vagy újratöltése'));
  window.addEventListener('beforeunload', e => {
    if (state?.stage==='exam') {e.preventDefault();e.returnValue='';}
  });
  window.addEventListener('popstate', () => {
    if (state?.stage==='exam') {
      guard('Böngésző visszalépés');
      history.pushState({osztvExam:true},'',location.pathname+location.search+location.hash);
    }
  });
  document.addEventListener('contextmenu',e=>{if(state?.stage==='exam') e.preventDefault();});
  document.addEventListener('copy',e=>{if(state?.stage==='exam') e.preventDefault();});
  document.addEventListener('keydown',e=>{
    if (state?.stage!=='exam') return;
    if ((e.ctrlKey||e.metaKey)&&['c','v','x','u','s','p'].includes(e.key.toLowerCase())) e.preventDefault();
    if (e.key==='F12') e.preventDefault(); // Cannot reliably disable browser developer tools.
  });
  state=load();
  if (state && state.stage==='exam' && Date.now()>=state.deadline) finalize('Lejárt az idő');
  else if (state?.stage==='exam') {
    // A reload is not a free reset: answers and deadline remain, and navigation was logged on leaving.
    guardGraceUntil=Date.now()+2200;
    history.pushState({osztvExam:true},'',location.pathname+location.search+location.hash);
    examPage();
  } else if (state?.stage==='finished') {resultsPage();if(state.serverStatus!=='saved')sendResult();}
  else homepage();
  // A restored browser should honour the next attempt number after an explicit reset.
  const originalLaunch=launch;
  launch = function(name,group,attempt,alias) {
    const next=Number(document.documentElement.dataset.nextAttempt||'0');
    delete document.documentElement.dataset.nextAttempt;
    return originalLaunch(name,group,next||attempt,alias);
  };
  setInterval(checkTime,250);
})();

</script>
</body>
</html>
